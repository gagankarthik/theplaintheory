# Vulnerability management (SOC 2 CC7.1): weekly dependency updates, security fixes as they land.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
